<h1>YTU Backup</h1>
<p>YTU Backup is a personal backup tool. It copies its owner's own text files to the owner's own Google Drive account, using the open-source program rclone.</p>
<p>It is used by one person, its owner. It is not offered to the public and has no users other than the owner.</p>
